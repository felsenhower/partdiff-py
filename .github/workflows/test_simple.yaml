name: Correctness Check (simple)

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"

      - name: Set up Python
        run: uv python install


      - name: Run correctness check
        uses: parcio/partdiff_tester@v0.1.9
        with:
          executable: "uv run main.py"
          cwd: "./nuitka"
          strictness: "4"
          shuffle: "42"
          filter: '[
            "o:{\"lines\": \"0\"}"
          ]'
